<title>Juned Tuition Classes</title>
<style>
:root{color-scheme:light;--bg:#f3f8f7;--card:#ffffff;--line:#d9e6e3;--ink:#10201f;--mute:#4a5f5c;--pri:#0f766e;--onpri:#ffffff;--ok:#15803d;--bad:#dc2626;--acc:#d4a017;--h2:#92400e;--t1:#0f766e;--t2:#92400e;--time:#b45309;--item:#115e59;--lbl:#1f3a37;--glass:rgba(255,255,255,.92);--chip:#e8f1ef;--g1:#0f766e;--g2:#a16207}
:root[data-theme="dark"]{color-scheme:dark;--bg:#061f1e;--card:#0c2e2c;--line:#1d4744;--ink:#eaf6f3;--mute:#9cc4be;--pri:#2dd4bf;--onpri:#042f2e;--ok:#4ade80;--bad:#f87171;--acc:#fbbf24;--h2:#fcd34d;--t1:#5eead4;--t2:#fcd34d;--time:#fdba74;--item:#99f6e4;--lbl:#cde7e3;--glass:rgba(6,31,30,.92);--chip:#123b38;--g1:#5eead4;--g2:#fcd34d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-top:env(safe-area-inset-top)}
#app{max-width:560px;margin:0 auto}
.wrap{padding:16px 16px 100px}
.center{text-align:center;padding-top:80px}
h1{font-size:26px;margin:8px 0 10px}h2{font-size:17px;margin:18px 0 8px}
p{margin:0 0 8px}
.mute{color:var(--mute)}.sm{font-size:13px}.block{display:block}.bad{color:var(--bad)}.big{font-size:34px;font-weight:700;line-height:1.1;margin-bottom:6px}
.logo{width:54px;height:54px;border-radius:14px;background:linear-gradient(135deg,var(--pri),var(--ok));color:var(--onpri);display:grid;place-items:center;font-weight:800;font-size:24px;margin-top:20px}
label{display:block;font-size:14px;font-weight:600;margin:14px 0 6px}
input,select,textarea{width:100%;padding:13px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--pri);outline-offset:1px}
.btn{width:100%;margin-top:20px;padding:14px;border:0;border-radius:10px;background:var(--pri);color:var(--onpri);font:inherit;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.6}.btn.ghost{background:none;border:1.5px solid var(--line);color:var(--ink)}
.link{display:block;margin:10px auto 0;background:none;border:0;color:var(--pri);font:inherit;font-weight:600;padding:10px;cursor:pointer}
.head{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--glass);border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.row{display:flex;gap:12px;align-items:center}.grow{flex:1;min-width:0}
a.card{color:inherit;text-decoration:none}
.ic{flex:none;width:46px;height:46px;border-radius:10px;display:grid;place-items:center;font-size:11px;font-weight:800;color:var(--onpri)}
.ic.pdf{background:var(--bad)}.ic.vid{background:var(--pri)}
.chip{display:inline-block;padding:7px 12px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
.chip.ok{background:var(--ok);border-color:var(--ok);color:var(--onpri);font-weight:700}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px}
.chips button{flex:none;padding:8px 14px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
.chips button.on{background:var(--pri);border-color:var(--pri);color:var(--onpri);font-weight:700}
.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:560px;display:grid;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav button{padding:14px 0;border:0;background:none;color:var(--mute);font:inherit;font-size:11px;cursor:pointer}

const csvCell = v => { v = v == null ? "" : String(v); return /[",\r\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
const toCsv = (head, rows) => "\ufeff" + [head, ...rows].map(r => r.map(csvCell).join(",")).join("\r\n");
function download(name, text, type) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], {type: type || "text/csv;charset=utf-8"}));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

async function backup(kind) {
  const day = todayStr(), users = await readAll("users"), nm = {};
  users.forEach(u => { nm[u.id] = u.name || u.email || u.id; });
  const dt = t => t && t.toDate ? t.toDate().toISOString().slice(0, 10) : "";
  const cmp = (i, j, k) => (a, c) => String(a[i]).localeCompare(String(c[i])) || String(a[j]).localeCompare(String(c[j])) || String(a[k]).localeCompare(String(c[k]));
  if (kind === "students") return download(`students-${day}.csv`, toCsv(["Name", "Email", "Class", "Role", "Status"], users.map(u => [u.name, u.email, u.classId, u.role, u.status]).sort(cmp(2, 0, 1))));
  if (kind === "attendance") { const rows = []; (await readAll("attendance")).forEach(a => Object.entries(a.days || {}).forEach(([d, v]) => rows.push([a.classId, nm[a.uid], a.month + "-" + pad(d), v === "P" ? "Present" : "Absent"]))); return download(`attendance-${day}.csv`, toCsv(["Class", "Student", "Date", "Status"], rows.sort(cmp(0, 1, 2)))); }
  if (kind === "results") return download(`marks-${day}.csv`, toCsv(["Class", "Student", "Test", "Subject", "Date", "Marks", "Out of", "Percent", "Class average", "Rank"], (await readAll("results")).map(r => [r.classId, nm[r.uid], r.testName, r.subject, r.date, r.marks, r.max, r.max ? Math.round(100 * r.marks / r.max) : "", r.classAvg, r.rank]).sort(cmp(0, 1, 2))));
  if (kind === "timetable") { const rows = []; (await readAll("timetable")).forEach(t => (t.periods || []).forEach(p => rows.push([t.classId, t.day, p.time, p.subject, p.teacher]))); return download(`timetable-${day}.csv`, toCsv(["Class", "Day", "Start time", "Subject", "Teacher"], rows.sort((a, c) => String(a[0]).localeCompare(String(c[0])) || DAYS.indexOf(a[1]) - DAYS.indexOf(c[1]) || String(a[2]).localeCompare(String(c[2]))))); }
  if (kind === "notices") return download(`notices-${day}.csv`, toCsv(["Class", "Date", "Title", "Message"], (await readAll("notices")).map(n => [n.classId, dt(n.createdAt), n.title, n.body]).sort(cmp(0, 1, 2))));
  if (kind === "materials") return download(`materials-${day}.csv`, toCsv(["Class", "Subject", "Title", "Type", "Link", "Added"], (await readAll("materials")).map(m => [m.classId, m.subject, m.title, m.type, m.url, dt(m.createdAt)]).sort(cmp(0, 1, 2))));
  if (kind === "homework") return download(`homework-${day}.csv`, toCsv(["Class", "Subject", "Homework", "Details", "Due", "Posted"], (await readAll("homework")).map(h => [h.classId, h.subject, h.title, h.details, h.due, dt(h.createdAt)]).sort(cmp(0, 4, 1))));
  if (kind === "events") return download(`calendar-${day}.csv`, toCsv(["For", "Type", "Title", "Date"], (await readAll("events")).map(e => [e.classId, e.type, e.title, e.date]).sort(cmp(0, 3, 2))));
  if (kind === "fees") return download(`fees-${day}.csv`, toCsv(["Class", "Student", "Month", "Status", "Amount"], (await readAll("fees")).map(f => [f.classId, nm[f.uid], f.month, f.status, f.amount]).sort(cmp(0, 1, 2))));
  const all = {exportedOn: day, users, materials: await readAll("materials"), notices: await readAll("notices"), timetable: await readAll("timetable"), results: await readAll("results"), attendance: await readAll("attendance"), homework: await readAll("homework"), events: await readAll("events"), fees: await readAll("fees"), settings: await readAll("settings")};
  download(`full-backup-${day}.json`, JSON.stringify(plain(all), null, 1), "application/json");
}

function testView(b){
  on(query(collection(db, "results"), where("uid", "==", me.uid)), s => {
    const T = s.docs.map(d => d.data()).sort((a, c) => String(a.date).localeCompare(String(c.date)));
    if (!T.length) { b.innerHTML = `<h1>Test analysis</h1><p class="mute">No results yet.</p>`; return; }
    const sub = {}; let tm = 0, tx = 0, ta = 0;
    T.forEach(t => {
      const avg = t.classAvg ?? 0; tm += t.marks; tx += t.max; ta += avg;
      const o = sub[t.subject] || (sub[t.subject] = {m: 0, x: 0, a: 0}); o.m += t.marks; o.x += t.max; o.a += avg;
    });
    const E = Object.entries(sub);
    const lo = E.reduce((a, c) => pc(c[1].m, c[1].x) < pc(a[1].m, a[1].x) ? c : a);
    const hi = E.reduce((a, c) => pc(c[1].m, c[1].x) > pc(a[1].m, a[1].x) ? c : a);
    const last = T[T.length - 1];
    const bars = E.map(([n, o]) => `<div style="margin-bottom:14px"><div class="row" style="justify-content:space-between"><span>${esc(n)} ${E.length > 1 && n === lo[0] ? `<span class="tg w">Needs focus</span>` : E.length > 1 && n === hi[0] ? `<span class="tg g">Strongest</span>` : ""}</span><b>${pc(o.m, o.x)}%</b></div><div class="trk"><div class="fil" style="width:${pc(o.m, o.x)}%"></div><i class="mk" style="left:${pc(o.a, o.x)}%"></i></div></div>`).join("");
    const trend = T.slice(-6).map(t => `<i style="height:${pc(t.marks, t.max)}%"><em>${pc(t.marks, t.max)}</em></i>`).join("");
    const list = T.slice().reverse().map(t => `<div class="card row"><div class="grow"><b>${esc(t.testName)}, ${esc(t.subject)}</b><span class="mute sm block">${esc(t.date)}${t.rank ? ", rank " + t.rank + " of " + t.count : ""}</span></div><div style="text-align:right"><b>${t.marks}/${t.max}</b><br><span class="tg ${t.marks >= (t.classAvg ?? 0) ? "g" : "w"}">${t.marks >= (t.classAvg ?? 0) ? "Above avg" : "Below avg"}</span></div></div>`).join("");
    b.innerHTML = `<h1>Test analysis</h1>
    <div class="card"><div class="big">${pc(tm, tx)}%</div><p class="mute">Your average over ${T.length} tests. Class average is ${pc(ta, tx)}%.${last.rank ? " Latest rank: " + last.rank + " of " + last.count + "." : ""}</p></div>
    <div class="card"><h2 style="margin-top:0">By subject</h2><p class="mute sm">The yellow line is the class average.</p>${bars}</div>
    <div class="card"><h2 style="margin-top:0">Recent trend</h2><div class="tr">${trend}</div></div>
    <h2>All tests</h2>${list}`;
  }, "ts");
}

// ---------- admin screens
function adminView(){
  const T = [["a-home","🏠<br>Home"],["a-post","📚<br>Post"],["a-att","✅<br>Attend."],["a-res","📝<br>Marks"],["a-tt","🗓<br>Timing"]];
  if (prof.role === "admin") T.push(["a-stu","👥<br>People"]);
  root.innerHTML = shell(APP_NAME, TAGLINE, T);
  ({"a-home": aHome, "a-post": aPost, "a-stu": aPeople, "a-att": aAtt, "a-tt": aTT, "a-res": aRes, "prof": profView}[tab])($("#body"));
}
const approvedQ = () => query(collection(db, "users"), where("classId", "==", aCls), where("status", "==", "approved"));
const names = s => s.docs.filter(d => !staff(d.data().role)).map(d => ({id: d.id, ...d.data()})).sort((a, c) => String(a.name).localeCompare(String(c.name)));

let postSel = "mat", peopleSel = "ppl", evCls = "all", fMonth = mkey(new Date()), feeMarks = {};
function aPost(b){ b.innerHTML = segHtml([["mat", "Material"], ["not", "Notice"], ["hw", "Homework"], ["ev", "Calendar"]], postSel, "psel") + `<div id="sub"></div>`; ({mat: aMat, not: aNot, hw: aHw, ev: aEv}[postSel])($("#sub")); }
function aPeople(b){ b.innerHTML = segHtml([["ppl", "People"], ["fee", "Fees"]], peopleSel, "gsel") + `<div id="sub"></div>`; (peopleSel === "fee" ? aFee : aStu)($("#sub")); }

// staff dashboard: counts, today's attendance by class, quick links
function aHome(b){
  const now = new Date(), st = {users: [], att: []};
  const draw = () => {
    const stud = st.users.filter(u => !staff(u.role) && u.status === "approved"), pend = st.users.filter(u => u.status === "pending"), day = now.getDate(), admin = prof.role === "admin";
    const per = CLASSES.map(c => { let p = 0, a = 0; st.att.filter(x => x.classId === c).forEach(x => { const v = (x.days || {})[day]; if (v === "P") p++; else if (v === "A") a++; }); return {c, p, a, total: stud.filter(u => u.classId === c).length}; }).filter(x => x.total);
    const absent = per.reduce((n, x) => n + x.a, 0);
    b.innerHTML = `<div class="hero"><h1>Hello, ${esc(String(prof.name || "").split(" ")[0])} 👋</h1><p>${admin ? "Administrator" : "Teacher"} \u2022 ${now.toLocaleDateString(undefined, {weekday: "long", day: "numeric", month: "long"})}</p></div>
    <div class="stats"><div class="stat"><b class="c-t1">${stud.length}</b><span>Students</span></div>${admin ? `<div class="stat"><b class="${pend.length ? "c-bad" : "c-ok"}">${pend.length}</b><span>Waiting</span></div>` : `<div class="stat"><b class="c-t2">${per.length}</b><span>Classes</span></div>`}<div class="stat"><b class="${absent ? "c-bad" : "c-ok"}">${absent}</b><span>Absent today</span></div></div>` +
      (admin && pend.length ? `<div class="sh2"><h2>Waiting for approval</h2><button class="lk" data-a="tab" data-v="a-stu">Review \u203a</button></div><p class="mute">${pend.slice(0, 3).map(u => esc(u.name)).join(", ")}${pend.length > 3 ? " and " + (pend.length - 3) + " more" : ""}</p>` : "") +
      `<div class="sh2"><h2>Today's attendance</h2></div>` +
      (per.length ? per.map(x => `<button class="card row cp" style="width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer" data-a="gat" data-v="${esc(x.c)}"><div class="grow"><b>${esc(x.c)}</b><span class="mute sm block">${x.total} ${x.total === 1 ? "student" : "students"}</span></div>${x.p + x.a ? `<span class="tg ${x.a ? "w" : "g"}">${x.p} present, ${x.a} absent</span>` : `<span class="tg w">Not marked</span>`}</button>`).join("") : `<p class="mute">No approved students yet.</p>`) +
      `<div class="sh2"><h2>Quick post</h2></div><div class="ra"><button class="chip" data-a="gopost" data-v="not">📢 Notice</button><button class="chip" data-a="gopost" data-v="mat">📁 Material</button><button class="chip" data-a="gopost" data-v="hw">📝 Homework</button><button class="chip" data-a="gopost" data-v="ev">📅 Calendar</button></div>`;
  };
  on(collection(db, "users"), s => { st.users = s.docs.map(d => d.data()); draw(); }, "ausers");
  on(query(collection(db, "attendance"), where("month", "==", mkey(now))), s => { st.att = s.docs.map(d => d.data()); draw(); }, "aatt" + mkey(now));
}

function aHw(b){
  const t = new Date(Date.now() + 864e5), tomorrow = t.getFullYear() + "-" + pad(t.getMonth() + 1) + "-" + pad(t.getDate());
  b.innerHTML = `<h1>Homework</h1>
  <label for="hc">Class</label><select id="hc">${opts(CLASSES, aCls)}</select>
  <label for="hs">Subject</label><select id="hs">${opts(SUBJECTS)}</select>
  <label for="ht">Homework</label><input id="ht" placeholder="Example: Exercise 4.2, questions 1 to 10">
  <label for="hd">Details (optional)</label><textarea id="hd" rows="3"></textarea>
  <label for="hdue">Due date</label><input id="hdue" type="date" value="${tomorrow}">
  ${NOTI}<button class="btn" data-a="addh">Post homework</button>
  <h2>Posted for this class</h2><div id="hl"></div>`;
  $("#hc").onchange = e => { aCls = e.target.value; render(); };
  on(query(collection(db, "homework"), where("classId", "==", aCls)), s => {
    const L = s.docs.map(d => ({id: d.id, ...d.data()})).sort((a, c) => c.due.localeCompare(a.due));
    $("#hl").innerHTML = L.length ? L.map(h => `<div class="card row"><div class="grow"><b>${esc(h.title)}</b><span class="mute sm block">${esc(h.subject)}, due ${fmtDate(h.due)}</span></div><button class="chip" data-a="delh" data-v="${h.id}">Delete</button></div>`).join("") : `<p class="mute">Nothing yet.</p>`;
  });
}

function aEv(b){
  b.innerHTML = `<h1>Holidays and exams</h1>
  <label for="ec">For</label><select id="ec"><option value="all">All classes</option>${opts(CLASSES, evCls)}</select>
  <label for="et">Type</label><select id="et"><option value="holiday">Holiday</option><option value="exam">Exam or test</option></select>
  <label for="en">Title</label><input id="en" placeholder="Example: Diwali holiday, Unit test 2">
  <label for="ed">Date</label><input id="ed" type="date" value="${todayStr()}">
  ${NOTI}<button class="btn" data-a="adde">Add to calendar</button>
  <h2>Already added</h2><div id="el"></div>`;
  $("#ec").value = evCls;
  $("#ec").onchange = e => { evCls = e.target.value; render(); };
  on(query(collection(db, "events"), where("classId", "==", evCls)), s => {
    const L = s.docs.map(d => ({id: d.id, ...d.data()})).sort((a, c) => c.date.localeCompare(a.date));
    $("#el").innerHTML = L.length ? L.map(e => `<div class="card row"><span class="tg ${e.type === "holiday" ? "w" : "g"}">${e.type === "holiday" ? "Holiday" : "Exam"}</span><div class="grow"><b>${esc(e.title)}</b><span class="mute sm block">${fmtDate(e.date)}</span></div><button class="chip" data-a="delev" data-v="${e.id}">Delete</button></div>`).join("") : `<p class="mute">Nothing yet.</p>`;
  });
}

function aFee(b){
  b.innerHTML = `<h1>Fees</h1>
  <label for="fcl">Class</label><select id="fcl">${opts(CLASSES, aCls)}</select>
  <label for="fm">Month</label><input id="fm" type="month" value="${fMonth}">
  <label for="fa">Amount (optional, in rupees)</label><input id="fa" type="number" inputmode="numeric">
  <div id="fl" style="margin-top:14px"></div>`;
  $("#fcl").onchange = e => { aCls = e.target.value; feeMarks = {}; render(); };
  $("#fm").onchange = e => { fMonth = e.target.value || mkey(new Date()); feeMarks = {}; render(); };
  let stu = [], saved = {};
  const st = id => feeMarks[id] || saved[id] || "due";
  const draw = () => {
    $("#fl").innerHTML = stu.length ? stu.map(u => `<div class="card row"><div class="grow"><b>${esc(u.name)}</b></div><div class="seg"><button class="${st(u.id) === "paid" ? "on p" : ""}" data-a="fk" data-v="${u.id}|paid">Paid</button><button class="${st(u.id) === "due" ? "on a" : ""}" data-a="fk" data-v="${u.id}|due">Due</button></div></div>`).join("") + `<button class="btn" data-a="savefee">Save fee status</button>` : `<p class="mute">No approved students in this class.</p>`;
  };
  acts.fk = d => { const [i, v] = d.v.split("|"); feeMarks[i] = v; draw(); };
  acts.savefee = async () => {
    try {
      const batch = writeBatch(db), amt = $("#fa").value.trim();
      stu.forEach(u => batch.set(doc(db, "fees", u.id + "_" + fMonth), {uid: u.id, classId: aCls, month: fMonth, status: st(u.id), ...(amt ? {amount: amt} : {}), createdAt: serverTimestamp()}, {merge: true}));
      await batch.commit(); toast("Fee status saved");
    } catch (e) { fail(e); }
  };
  on(approvedQ(), s => { stu = names(s); draw(); });
  on(query(collection(db, "fees"), where("classId", "==", aCls), where("month", "==", fMonth)), s => { saved = {}; s.docs.forEach(d => { saved[d.data().uid] = d.data().status; }); draw(); });
}

function aStu(b){
  b.innerHTML = `<h1>People</h1><h2>Waiting for approval</h2><div id="pend"></div><h2>Teachers</h2><div id="tch"></div><h2>Students</h2><select id="fc" aria-label="Class">${opts(CLASSES, aCls)}</select><div id="appr" style="margin-top:10px"></div>`;
  $("#fc").onchange = e => { aCls = e.target.value; render(); };
  const by = (a, c) => String(a.name).localeCompare(String(c.name));
  on(query(collection(db, "users"), where("status", "==", "pending")), s => {
    $("#pend").innerHTML = s.docs.length ? s.docs.map(d => { const u = d.data(); return `<div class="card"><b>${esc(u.name)}</b><span class="mute sm block">${esc(u.classId)}, ${esc(u.email)}</span><div class="ra"><button class="chip" data-a="rej" data-v="${d.id}">Reject</button><button class="chip ok" data-a="apr" data-v="${d.id}">Approve student</button><button class="chip ok" data-a="aprt" data-v="${d.id}">Approve teacher</button></div></div>`; }).join("") : `<p class="mute">No new requests.</p>`;
  });
  on(query(collection(db, "users"), where("role", "==", "teacher"), where("status", "==", "approved")), s => {
    const L = s.docs.map(d => ({id: d.id, ...d.data()})).sort(by);
    $("#tch").innerHTML = L.length ? L.map(u => `<div class="card"><b>${esc(u.name)}</b><span class="mute sm block">${esc(u.email)}</span><div class="ra"><button class="chip" data-a="mks" data-v="${u.id}">Make student</button><button class="chip" data-a="rem" data-v="${u.id}">Remove</button></div></div>`).join("") : `<p class="mute">No teachers yet. Teachers sign up like students, and you approve them as teachers.</p>`;
  });
  on(approvedQ(), s => {
    const L = names(s);
    $("#appr").innerHTML = L.length ? L.map(u => `<div class="card"><b>${esc(u.name)}</b><span class="mute sm block">${esc(u.email)}</span><div class="ra"><select class="mv" data-id="${u.id}" aria-label="Move to class">${opts(CLASSES, aCls)}</select><button class="chip" data-a="mkt" data-v="${u.id}">Make teacher</button><button class="chip" data-a="rem" data-v="${u.id}">Remove</button></div></div>`).join("") : `<p class="mute">No approved students in this class.</p>`;
  });
}

function aMat(b){
  b.innerHTML = `<h1>Add material</h1>
  <label for="mc">Class</label><select id="mc">${opts(CLASSES, aCls)}</select>
  <label for="ms">Subject</label><select id="ms">${opts(SUBJECTS)}</select>
  <label for="mt">Title</label><input id="mt">
  <label for="ml">Google Drive or YouTube link</label><input id="ml" type="url" placeholder="https://">
  <label for="mk">Type</label><select id="mk"><option value="pdf">PDF or notes</option><option value="video">Video</option></select>
  ${NOTI}<button class="btn" data-a="addm">Publish material</button>
  <h2>Already published for this class</h2><div id="ml-list"></div>`;
  $("#mc").onchange = e => { aCls = e.target.value; render(); };
  on(query(collection(db, "materials"), where("classId", "==", aCls)), s => {
    const L = s.docs.map(d => ({id: d.id, ...d.data()})).sort((a, c) => ts(c) - ts(a));
    $("#ml-list").innerHTML = L.length ? L.map(i => `<div class="card row"><div class="grow"><b>${esc(i.title)}</b><span class="mute sm block">${esc(i.subject)}</span></div><button class="chip" data-a="delm" data-v="${i.id}">Delete</button></div>`).join("") : `<p class="mute">Nothing yet.</p>`;
  });
}

function aNot(b){
  b.innerHTML = `<h1>Post notice</h1>
  <label for="nc">Class</label><select id="nc">${opts(CLASSES, aCls)}</select>
  <label for="nt">Title</label><input id="nt">
  <label for="nb">Message</label><textarea id="nb" rows="4"></textarea>
  ${NOTI}<button class="btn" data-a="addn">Send notice to class</button>
  <h2>Already posted for this class</h2><div id="nl"></div>`;
  $("#nc").onchange = e => { aCls = e.target.value; render(); };
  on(query(collection(db, "notices"), where("classId", "==", aCls)), s => {
    const L = s.docs.map(d => ({id: d.id, ...d.data()})).sort((a, c) => ts(c) - ts(a));
    $("#nl").innerHTML = L.length ? L.map(n => `<div class="card row"><div class="grow"><b>${esc(n.title)}</b><span class="mute sm block">${fmt(n.createdAt)}</span></div><button class="chip" data-a="deln" data-v="${n.id}">Delete</button></div>`).join("") : `<p class="mute">Nothing yet.</p>`;
  });
}

function aAtt(b){
  b.innerHTML = `<h1>Mark attendance</h1>
  <label for="ac">Class</label><select id="ac">${opts(CLASSES, aCls)}</select>
  <label for="ad">Date</label><input id="ad" type="date" value="${aDate}" max="${todayStr()}">
  <div id="al" style="margin-top:14px"></div>`;
  $("#ac").onchange = e => { aCls = e.target.value; marks = {}; render(); };
  $("#ad").onchange = e => { aDate = e.target.value || todayStr(); marks = {}; render(); };
  const mk = aDate.slice(0, 7), day = Number(aDate.slice(8));
  let stu = [], saved = {};
  const status = id => marks[id] || saved[id] || "P";
  const draw = () => {
    $("#al").innerHTML = stu.length ? stu.map(u => `<div class="card row"><div class="grow"><b>${esc(u.name)}</b></div><div class="seg"><button class="${status(u.id) === "P" ? "on p" : ""}" data-a="mk" data-v="${u.id}|P">P</button><button class="${status(u.id) === "A" ? "on a" : ""}" data-a="mk" data-v="${u.id}|A">A</button></div></div>`).join("") + `<button class="btn" data-a="saveatt">Save attendance</button>` : `<p class="mute">No approved students in this class.</p>`;
  };
  acts.mk = d => { const [i, v] = d.v.split("|"); marks[i] = v; draw(); };
  acts.saveatt = async () => {
    try {
      const batch = writeBatch(db);
      stu.forEach(u => batch.set(doc(db, "attendance", u.id + "_" + mk), {uid: u.id, classId: aCls, month: mk, days: {[day]: status(u.id)}}, {merge: true}));
      await batch.commit(); toast("Attendance saved");
    } catch (e) { fail(e); }
  };
  on(approvedQ(), s => { stu = names(s); draw(); });
  on(query(collection(db, "attendance"), where("classId", "==", aCls), where("month", "==", mk)), s => {
    saved = {}; s.docs.forEach(d => { saved[d.data().uid] = (d.data().days || {})[day]; }); draw();
  });
}
</script>
</body>
</html>
