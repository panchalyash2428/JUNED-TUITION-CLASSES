<title>Juned Tuition Classes</title>
<style>
:root{color-scheme:light;--bg:#f3f8f7;--card:#ffffff;--line:#d9e6e3;--ink:#10201f;--mute:#4a5f5c;--pri:#0f766e;--onpri:#ffffff;--ok:#15803d;--bad:#dc2626;--acc:#d4a017;--h2:#92400e;--t1:#0f766e;--t2:#92400e;--time:#b45309;--item:#115e59;--lbl:#1f3a37;--glass:rgba(255,255,255,.92);--chip:#e8f1ef;--g1:#0f766e;--g2:#a16207}
:root[data-theme="dark"]{color-scheme:dark;--bg:#061f1e;--card:#0c2e2c;--line:#1d4744;--ink:#eaf6f3;--mute:#9cc4be;--pri:#2dd4bf;--onpri:#042f2e;--ok:#4ade80;--bad:#f87171;--acc:#fbbf24;--h2:#fcd34d;--t1:#5eead4;--t2:#fcd34d;--time:#fdba74;--item:#99f6e4;--lbl:#cde7e3;--glass:rgba(6,31,30,.92);--chip:#123b38;--g1:#5eead4;--g2:#fcd34d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-top:env(safe-area-inset-top)}
#app{max-width:560px;margin:0 auto}
.wrap{padding:16px 16px 100px}
.center{text-align:center;padding-top:80px}
h1{font-size:26px;margin:8px 0 10px}h2{font-size:17px;margin:18px 0 8px}
p{margin:0 0 8px}
.mute{color:var(--mute)}.sm{font-size:13px}.block{display:block}.bad{color:var(--bad)}.big{font-size:34px;font-weight:700;line-height:1.1;margin-bottom:6px}
.logo{width:54px;height:54px;border-radius:14px;background:linear-gradient(135deg,var(--pri),var(--ok));color:var(--onpri);display:grid;place-items:center;font-weight:800;font-size:24px;margin-top:20px}
label{display:block;font-size:14px;font-weight:600;margin:14px 0 6px}
input,select,textarea{width:100%;padding:13px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--pri);outline-offset:1px}
.btn{width:100%;margin-top:20px;padding:14px;border:0;border-radius:10px;background:var(--pri);color:var(--onpri);font:inherit;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.6}.btn.ghost{background:none;border:1.5px solid var(--line);color:var(--ink)}
.link{display:block;margin:10px auto 0;background:none;border:0;color:var(--pri);font:inherit;font-weight:600;padding:10px;cursor:pointer}
.head{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--glass);border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.row{display:flex;gap:12px;align-items:center}.grow{flex:1;min-width:0}
a.card{color:inherit;text-decoration:none}
.ic{flex:none;width:46px;height:46px;border-radius:10px;display:grid;place-items:center;font-size:11px;font-weight:800;color:var(--onpri)}
.ic.pdf{background:var(--bad)}.ic.vid{background:var(--pri)}
.chip{display:inline-block;padding:7px 12px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
.chip.ok{background:var(--ok);border-color:var(--ok);color:var(--onpri);font-weight:700}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px}
.chips button{flex:none;padding:8px 14px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
.chips button.on{background:var(--pri);border-color:var(--pri);color:var(--onpri);font-weight:700}
.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:560px;display:grid;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav button{padding:14px 0;border:0;background:none;color:var(--mute);font:inherit;font-size:11px;cursor:pointer}
.nav button.on{color:var(--pri);font-weight:700;box-shadow:inset 0 3px 0 var(--acc)}
.mrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;font-size:13px}
.cal span{aspect-ratio:1;display:grid;place-items:center;border-radius:8px;background:var(--chip)}
.cal span:empty{background:none}.cal .hd{aspect-ratio:auto;background:none;color:var(--mute)}
.cal .H{background:var(--bad);color:var(--onpri)}.cal .E{background:var(--acc);color:#1b1300}
.cal .P{background:var(--ok);color:var(--onpri)}.cal .A{background:var(--bad);color:var(--onpri)}.cal .sun{opacity:.45}
.seg{display:flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{padding:8px 16px;border:0;background:none;color:var(--ink);font:inherit;cursor:pointer}

const SEC = ["mat", "not", "hw", "cal", "fee", "tt", "ts", "att"];
let seenAt = {}, WD = {}, WS = [], WK = "";
const tms = (d, f) => (d && d[f] && d[f].toMillis ? d[f].toMillis() : 0);
const loadSeen = () => { try { seenAt = JSON.parse(localStorage.getItem("jtcSeen:" + me.uid) || "{}"); } catch (e) { seenAt = {}; } };
const saveSeen = () => { try { localStorage.setItem("jtcSeen:" + me.uid, JSON.stringify(seenAt)); } catch (e) {} };
const secTimes = k => k === "cal" ? [...(WD.cal1 || []), ...(WD.cal2 || [])] : (WD[k] || []);
const curSec = () => tab === "mat" ? "mat" : tab === "upd" ? updSel : ["tt", "ts", "att"].includes(tab) ? tab : null;
function stopWatch(){ WS.forEach(u => u()); WS = []; WD = {}; WK = ""; seenAt = {}; }
function initSeen(sec){
  if (seenAt[sec] !== undefined || (sec === "cal" && !(WD.cal1 && WD.cal2))) return;
  seenAt[sec] = Math.max(0, ...secTimes(sec)); saveSeen();   // what already existed counts as seen
}
function startWatch(){
  const key = me.uid + "|" + prof.role + "|" + prof.classId;
  if (WK === key) return;
  stopWatch(); WK = key;
  if (staff(prof.role)) {
    if (prof.role === "admin") WS.push(onSnapshot(query(collection(db, "users"), where("status", "==", "pending")), s => { WD.pend = s.docs.length; updateBadges(); }, () => {}));
    return;
  }
  loadSeen();
  const c = prof.classId, track = (k, sec, q, f) => WS.push(onSnapshot(q, s => { WD[k] = s.docs.map(d => tms(d.data(), f)); initSeen(sec); updateBadges(); }, () => {}));
  track("mat", "mat", query(collection(db, "materials"), where("classId", "==", c)), "createdAt");
  track("not", "not", query(collection(db, "notices"), where("classId", "==", c)), "createdAt");
  track("hw", "hw", query(collection(db, "homework"), where("classId", "==", c)), "createdAt");
  track("cal1", "cal", query(collection(db, "events"), where("classId", "==", c)), "createdAt");
  track("cal2", "cal", query(collection(db, "events"), where("classId", "==", "all")), "createdAt");
  track("fee", "fee", query(collection(db, "fees"), where("uid", "==", me.uid)), "createdAt");
  track("tt", "tt", query(collection(db, "timetable"), where("classId", "==", c)), "updatedAt");
  track("ts", "ts", query(collection(db, "results"), where("uid", "==", me.uid)), "createdAt");
  WS.push(onSnapshot(doc(db, "attendance", me.uid + "_" + mkey(new Date())), s => { WD.att = s.exists() ? [tms(s.data(), "updatedAt")] : []; initSeen("att"); updateBadges(); }, () => {}));
}
function updateBadges(){
  if (!prof || !me) return;
  let tabN = {}, subN = {}, total = 0;
  if (prof.role === "admin") { subN.pend = tabN["a-stu"] = WD.pend || 0; total = tabN["a-stu"]; }
  else if (!staff(prof.role)) {
    const cs = curSec();   // whatever you are looking at right now counts as seen
    if (cs && secTimes(cs).length) { const m = Math.max(0, ...secTimes(cs)); if (m > (seenAt[cs] || 0)) { seenAt[cs] = m; saveSeen(); } }
    SEC.forEach(k => { subN[k] = seenAt[k] === undefined ? 0 : secTimes(k).filter(t => t > seenAt[k]).length; });
    tabN = {mat: subN.mat, upd: subN.not + subN.hw + subN.cal + subN.fee, tt: subN.tt, ts: subN.ts, att: subN.att};
    total = Object.values(tabN).reduce((a, n) => a + n, 0);
  }
  const show = (el, n, how) => { el.textContent = n > 9 ? "9+" : String(n || ""); el.style.display = n ? how : "none"; };
  document.querySelectorAll("[data-b]").forEach(el => show(el, tabN[el.dataset.b] || 0, "block"));
  document.querySelectorAll("[data-sb]").forEach(el => show(el, subN[el.dataset.sb] || 0, "inline-block"));
  try { if (navigator.setAppBadge) { total ? navigator.setAppBadge(total) : navigator.clearAppBadge(); } } catch (e) {}
}

const csvCell = v => { v = v == null ? "" : String(v); return /[",\r\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
const toCsv = (head, rows) => "\ufeff" + [head, ...rows].map(r => r.map(csvCell).join(",")).join("\r\n");
function download(name, text, type) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], {type: type || "text/csv;charset=utf-8"}));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

async function backup(kind) {

  const dt = t => t && t.toDate ? t.toDate().toISOString().slice(0, 10) : "";
  const cmp = (i, j, k) => (a, c) => String(a[i]).localeCompare(String(c[i])) || String(a[j]).localeCompare(String(c[j])) || String(a[k]).localeCompare(String(c[k]));
  if (kind === "students") return download(`students-${day}.csv`, toCsv(["Name", "Email", "Class", "Role", "Status"], users.map(u => [u.name, u.email, u.classId, u.role, u.status]).sort(cmp(2, 0, 1))));
  if (kind === "attendance") { const rows = []; (await readAll("attendance")).forEach(a => Object.entries(a.days || {}).forEach(([d, v]) => rows.push([a.classId, nm[a.uid], a.month + "-" + pad(d), v === "P" ? "Present" : "Absent"]))); return download(`attendance-${day}.csv`, toCsv(["Class", "Student", "Date", "Status"], rows.sort(cmp(0, 1, 2)))); }

  if (kind === "timetable") { const rows = []; (await readAll("timetable")).forEach(t => (t.periods || []).forEach(p => rows.push([t.classId, t.day, p.time, p.subject, p.teacher]))); return download(`timetable-${day}.csv`, toCsv(["Class", "Day", "Start time", "Subject", "Teacher"], rows.sort((a, c) => String(a[0]).localeCompare(String(c[0])) || DAYS.indexOf(a[1]) - DAYS.indexOf(c[1]) || String(a[2]).localeCompare(String(c[2]))))); }
  if (kind === "notices") return download(`notices-${day}.csv`, toCsv(["Class", "Date", "Title", "Message"], (await readAll("notices")).map(n => [n.classId, dt(n.createdAt), n.title, n.body]).sort(cmp(0, 1, 2))));
  if (kind === "materials") return download(`materials-${day}.csv`, toCsv(["Class", "Subject", "Title", "Type", "Link", "Added"], (await readAll("materials")).map(m => [m.classId, m.subject, m.title, m.type, m.url, dt(m.createdAt)]).sort(cmp(0, 1, 2))));
  if (kind === "homework") return download(`homework-${day}.csv`, toCsv(["Class", "Subject", "Homework", "Details", "Due", "Posted"], (await readAll("homework")).map(h => [h.classId, h.subject, h.title, h.details, h.due, dt(h.createdAt)]).sort(cmp(0, 4, 1))));
  if (kind === "events") return download(`calendar-${day}.csv`, toCsv(["For", "Type", "Title", "Date"], (await readAll("events")).map(e => [e.classId, e.type, e.title, e.date]).sort(cmp(0, 3, 2))));
  if (kind === "fees") return download(`fees-${day}.csv`, toCsv(["Class", "Student", "Month", "Status", "Amount"], (await readAll("fees")).map(f => [f.classId, nm[f.uid], f.month, f.status, f.amount]).sort(cmp(0, 1, 2))));
  const all = {exportedOn: day, users, materials: await readAll("materials"), notices: await readAll("notices"), timetable: await readAll("timetable"), results: await readAll("results"), attendance: await readAll("attendance"), homework: await readAll("homework"), events: await readAll("events"), fees: await readAll("fees"), settings: await readAll("settings")};
  download(`full-backup-${day}.json`, JSON.stringify(plain(all), null, 1), "application/json");
}

function testsHtml(T, own){
  if (!T.length) return `<p class="mute">No results yet.</p>`;
  const sub = {}; let tm = 0, tx = 0, ta = 0;
  T.forEach(t => {
    const avg = t.classAvg ?? 0; tm += t.marks; tx += t.max; ta += avg;
    const o = sub[t.subject] || (sub[t.subject] = {m: 0, x: 0, a: 0}); o.m += t.marks; o.x += t.max; o.a += avg;
  });
  const E = Object.entries(sub);
  const lo = E.reduce((a, c) => pc(c[1].m, c[1].x) < pc(a[1].m, a[1].x) ? c : a);
  const hi = E.reduce((a, c) => pc(c[1].m, c[1].x) > pc(a[1].m, a[1].x) ? c : a);
  const last = T[T.length - 1];
  const bars = E.map(([n, o]) => `<div style="margin-bottom:14px"><div class="row" style="justify-content:space-between"><span>${esc(n)} ${E.length > 1 && n === lo[0] ? `<span class="tg w">Needs focus</span>` : E.length > 1 && n === hi[0] ? `<span class="tg g">Strongest</span>` : ""}</span><b>${pc(o.m, o.x)}%</b></div><div class="trk"><div class="fil" style="width:${pc(o.m, o.x)}%"></div><i class="mk" style="left:${pc(o.a, o.x)}%"></i></div></div>`).join("");
  const trend = T.slice(-6).map(t => `<i style="height:${pc(t.marks, t.max)}%"><em>${pc(t.marks, t.max)}</em></i>`).join("");
  const list = T.slice().reverse().map(t => `<div class="card row"><div class="grow"><b>${esc(t.testName)}, ${esc(t.subject)}</b><span class="mute sm block">${esc(t.date)}${t.rank ? ", rank " + t.rank + " of " + t.count : ""}</span></div><div style="text-align:right"><b>${t.marks}/${t.max}</b><br><span class="tg ${t.marks >= (t.classAvg ?? 0) ? "g" : "w"}">${t.marks >= (t.classAvg ?? 0) ? "Above avg" : "Below avg"}</span></div></div>`).join("");
  return `<div class="card"><div class="big">${pc(tm, tx)}%</div><p class="mute">${own ? "Your average" : "Average"} over ${T.length} tests. Class average is ${pc(ta, tx)}%.${last.rank ? " Latest rank: " + last.rank + " of " + last.count + "." : ""}</p></div>
  <div class="card"><h2 style="margin-top:0">By subject</h2><p class="mute sm">The yellow line is the class average.</p>${bars}</div>
  <div class="card"><h2 style="margin-top:0">Recent trend</h2><div class="tr">${trend}</div></div>
  <h2>All tests</h2>${list}`;
}

  <h2>Already published for this class</h2><div id="ml-list"></div>`;

  on(query(collection(db, "materials"), where("classId", "==", aCls)), s => {
    const L = s.docs.map(d => ({id: d.id, ...d.data()})).sort((a, c) => ts(c) - ts(a));
    $("#ml-list").innerHTML = L.length ? L.map(i => `<div class="card row"><div class="grow"><b>${esc(i.title)}</b><span class="mute sm block">${esc(i.subject)}</span></div><button class="chip" data-a="delm" data-v="${i.id}">Delete</button></div>`).join("") : `<p class="mute">Nothing yet.</p>`;
  });
}

function aNot(b){
  b.innerHTML = `<h1>Post notice</h1>
  <label for="nc">Class</label><select id="nc">${opts(CLASSES, aCls)}</select>
  <label for="nt">Title</label><input id="nt">
  <label for="nb">Message</label><textarea id="nb" rows="4"></textarea>
  ${NOTI}<button class="btn" data-a="addn">Send notice to class</button>
  <h2>Already posted for this class</h2><div id="nl"></div>`;
  $("#nc").onchange = e => { aCls = e.target.value; render(); };
  on(query(collection(db, "notices"), where("classId", "==", aCls)), s => {
    const L = s.docs.map(d => ({id: d.id, ...d.data()})).sort((a, c) => ts(c) - ts(a));
    $("#nl").innerHTML = L.length ? L.map(n => `<div class="card row"><div class="grow"><b>${esc(n.title)}</b><span class="mute sm block">${fmt(n.createdAt)}</span></div><button class="chip" data-a="deln" data-v="${n.id}">Delete</button></div>`).join("") : `<p class="mute">Nothing yet.</p>`;
  });
}

function aAtt(b){
  b.innerHTML = `<h1>Mark attendance</h1>
  <label for="ac">Class</label><select id="ac">${opts(CLASSES, aCls)}</select>
  <label for="ad">Date</label><input id="ad" type="date" value="${aDate}" max="${todayStr()}">
  <div id="al" style="margin-top:14px"></div>`;
  $("#ac").onchange = e => { aCls = e.target.value; marks = {}; render(); };
  $("#ad").onchange = e => { aDate = e.target.value || todayStr(); marks = {}; render(); };
  const mk = aDate.slice(0, 7), day = Number(aDate.slice(8));
  let stu = [], saved = {};
  const status = id => marks[id] || saved[id] || "P";
  const draw = () => {
    $("#al").innerHTML = stu.length ? stu.map(u => `<div class="card row"><div class="grow"><b>${esc(u.name)}</b></div><div class="seg"><button class="${status(u.id) === "P" ? "on p" : ""}" data-a="mk" data-v="${u.id}|P">P</button><button class="${status(u.id) === "A" ? "on a" : ""}" data-a="mk" data-v="${u.id}|A">A</button></div></div>`).join("") + `<button class="btn" data-a="saveatt">Save attendance</button>` : `<p class="mute">No approved students in this class.</p>`;
  };
  acts.mk = d => { const [i, v] = d.v.split("|"); marks[i] = v; draw(); };
  acts.saveatt = async () => {
    try {
      const batch = writeBatch(db);
      stu.forEach(u => batch.set(doc(db, "attendance", u.id + "_" + mk), {uid: u.id, classId: aCls, month: mk, days: {[day]: status(u.id)}, updatedAt: serverTimestamp()}, {merge: true}));
      await batch.commit(); toast("Attendance saved");
    } catch (e) { fail(e); }
  };
  on(approvedQ(), s => { stu = names(s); draw(); });
  on(query(collection(db, "attendance"), where("classId", "==", aCls), where("month", "==", mk)), s => {
    saved = {}; s.docs.forEach(d => { saved[d.data().uid] = (d.data().days || {})[day]; }); draw();
  });
}
</script>
</body>
</html>
